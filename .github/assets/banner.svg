<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Qamqor</title>
  <desc id="d">Volunteer platform for Kazakhstan: find a cause, show up, get your hours confirmed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F4"/>
      <stop offset="1" stop-color="#FDE6E1"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F87171"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#7F1D1D" flood-opacity="0.13"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <circle cx="1210" cy="30" r="150" fill="#FECACA" opacity="0.35"/>
    <circle cx="660" cy="440" r="170" fill="#FEE2E2" opacity="0.7"/>
    <circle cx="40" cy="-30" r="110" fill="#FEE2E2" opacity="0.6"/>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="72" y="120" fill="#DC2626" font-size="15" font-weight="700" letter-spacing="3">VOLUNTEER PLATFORM · KAZAKHSTAN</text>
      <text x="68" y="212" fill="#1F1A17" font-size="100" font-weight="800" letter-spacing="-3">Qamqor</text>
      <text x="72" y="262" fill="#57534E" font-size="24" font-weight="400">Find a cause, show up, get your hours confirmed.</text>

      <g font-size="15" font-weight="600" text-anchor="middle">
        <rect x="72" y="296" width="124" height="36" rx="18" fill="#FFFFFF" stroke="#F5C9C2"/>
        <text x="134" y="319" fill="#B91C1C">Next.js 15</text>
        <rect x="206" y="296" width="164" height="36" rx="18" fill="#FFFFFF" stroke="#F5C9C2"/>
        <text x="288" y="319" fill="#B91C1C">Supabase + RLS</text>
        <rect x="380" y="296" width="140" height="36" rx="18" fill="#FFFFFF" stroke="#F5C9C2"/>
        <text x="450" y="319" fill="#B91C1C">RU · KZ · EN</text>
      </g>

      <!-- Certificate card (back) -->
      <g transform="translate(998 40) rotate(7)" filter="url(#shadow)">
        <rect width="244" height="196" rx="18" fill="#FFFFFF"/>
        <rect x="10" y="10" width="224" height="176" rx="12" fill="none" stroke="#FBD5CF" stroke-dasharray="4 5"/>
        <text x="100" y="44" fill="#DC2626" font-size="12" font-weight="700" letter-spacing="2.5">CERTIFICATE</text>
        <text x="100" y="70" fill="#1F2937" font-size="17" font-weight="700">Volunteer</text>
        <text x="100" y="91" fill="#1F2937" font-size="17" font-weight="700">participation</text>
        <rect x="100" y="106" width="110" height="7" rx="3.5" fill="#F3E8E5"/>
        <rect x="100" y="122" width="80" height="7" rx="3.5" fill="#F3E8E5"/>
        <circle cx="196" cy="152" r="24" fill="#DC2626"/>
        <path d="M185 152 l7.5 7.5 l15 -16" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Project card (front) -->
      <g transform="translate(724 124) rotate(-4)" filter="url(#shadow)">
        <rect width="330" height="226" rx="18" fill="#FFFFFF"/>
        <path d="M0 18 Q0 0 18 0 H312 Q330 0 330 18 V96 H0 Z" fill="url(#cover)"/>
        <g transform="translate(165 58)" fill="#FFFFFF">
          <path d="M0 20 V-6" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M0 6 C-15 6 -22 -4 -22 -16 C-9 -16 0 -8 0 6 Z"/>
          <path d="M0 -2 C13 -2 20 -12 20 -24 C7 -24 0 -15 0 -2 Z" opacity="0.88"/>
        </g>
        <rect x="16" y="14" width="84" height="26" rx="13" fill="#FFFFFF" opacity="0.92"/>
        <text x="58" y="32" fill="#B91C1C" font-size="13" font-weight="700" text-anchor="middle">Ecology</text>
        <text x="20" y="132" fill="#1F2937" font-size="19" font-weight="700">Tree planting in the park</text>
        <text x="20" y="157" fill="#6B7280" font-size="14" font-weight="500">Almaty · Saturday, 10:00</text>
        <rect x="20" y="176" width="96" height="30" rx="15" fill="#DCFCE7"/>
        <text x="68" y="196" fill="#15803D" font-size="13" font-weight="700" text-anchor="middle">Approved</text>
        <rect x="126" y="176" width="134" height="30" rx="15" fill="#FEE2E2"/>
        <text x="193" y="196" fill="#B91C1C" font-size="13" font-weight="700" text-anchor="middle">+4 h confirmed</text>
      </g>

      <!-- Achievement medal -->
      <g transform="translate(1168 318)" filter="url(#shadow)">
        <circle r="40" fill="#FFFFFF"/>
        <circle r="31" fill="none" stroke="#DC2626" stroke-width="3"/>
        <path d="M0.0 -20.0 L5.1 -7.0 L19.0 -6.2 L8.2 2.7 L11.8 16.2 L0.0 8.6 L-11.8 16.2 L-8.2 2.7 L-19.0 -6.2 L-5.1 -7.0Z" fill="#DC2626"/>
      </g>
    </g>
  </g>
</svg>
